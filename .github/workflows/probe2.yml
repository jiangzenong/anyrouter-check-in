name: probe-oauth
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 -m pip install -q httpx
          python3 - <<'PY'
          import httpx
          urls = ['https://agentrouter.org/api/oauth/state', 'https://agentrouter.org/api/status']
          plain = {'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'}
          browser = dict(plain)
          browser.update({'sec-ch-ua':'"Chromium";v="138", "Google Chrome";v="138", "Not-A.Brand";v="99"','sec-ch-ua-mobile':'?0','sec-ch-ua-platform':'"Windows"','Accept':'application/json, text/plain, */*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://agentrouter.org/console/topup','Origin':'https://agentrouter.org','Sec-Fetch-Dest':'empty','Sec-Fetch-Mode':'cors','Sec-Fetch-Site':'same-origin'})
          for u in urls:
              for name, h in (('plain', plain), ('browser', browser)):
                  try:
                      r = httpx.get(u, headers=h, timeout=30, follow_redirects=False)
                      print(name, u, 'status', r.status_code, 'ct', r.headers.get('content-type'), 'len', len(r.content), 'head', r.text[:70].replace(chr(10),' '))
                  except Exception as e:
                      print(name, u, 'ERR', type(e).__name__, str(e)[:120])
          PY
