name: probe-mirror
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 -m pip install -q httpx
          python3 - <<'PY'
          import httpx
          urls = ['https://ps.air-outer.com/api/status', 'https://ps.air-outer.com/api/oauth/state', 'https://agentrouter.org/api/oauth/state']
          h = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36','Accept':'application/json, text/plain, */*'}
          for u in urls:
              try:
                  r = httpx.get(u, headers=h, timeout=30, follow_redirects=False)
                  print('RESULT', u, 'status', r.status_code, 'ct', r.headers.get('content-type'), 'len', len(r.content), 'head', r.text[:50].replace(chr(10),' '))
              except Exception as e:
                  print('RESULT', u, 'ERR', type(e).__name__, str(e)[:100])
          PY
