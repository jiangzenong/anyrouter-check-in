name: 失败通知本地 Agent

# 当「AnyRouter 自动签到」失败时，把失败事件推送到本地监听通道，
# 由 Mac 上的 launchd 监听进程唤醒 DSH Agent 自动修复。
on:
  workflow_run:
    workflows: ["AnyRouter 自动签到"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 推送到本地 Agent 监听通道
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC 未配置，跳过"
            exit 0
          fi
          MSG="anyrouter-checkin-failed run_id=${RUN_ID:-manual} branch=${BRANCH:-main} url=${RUN_URL:-manual}"
          curl -sS -m 15 \
            -H "Title: AnyRouter checkin failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "$MSG" \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo "已推送: $MSG"
