name: probe-agentrouter
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: probe
        env:
          ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        run: |
          python3 -m pip install -q "httpx[http2]"
          python3 - <<'PY'
          import json, os, httpx
          acc = json.loads(os.environ['ACCOUNTS'])
          ag = [a for a in acc if a.get('provider') == 'agentrouter'][0]
          s = ag['cookies']['session']; u = ag['api_user']
          h = {'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
               'Accept':'application/json, text/plain, */*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
               'Referer':'https://agentrouter.org','Origin':'https://agentrouter.org','New-API-User':u}
          for name, h2 in (('h2', True), ('h1', False)):
              try:
                  with httpx.Client(http2=h2, timeout=30) as c:
                      c.cookies.set('session', s, domain='agentrouter.org')
                      r = c.get('https://agentrouter.org/api/user/self', headers=h)
                      print(name, 'status', r.status_code, 'proto', r.http_version, 'len', len(r.content))
                      print(name, 'ct', r.headers.get('content-type'), 'server', r.headers.get('server'))
                      print(name, 'set-cookie', [x.split('=')[0] for x in r.headers.get_list('set-cookie')])
                      print(name, 'head', r.text[:60].replace(chr(10), ' '))
              except Exception as e:
                  print(name, 'ERR', type(e).__name__, str(e)[:150])
          PY
